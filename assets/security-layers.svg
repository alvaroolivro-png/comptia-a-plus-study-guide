<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
<title id="title">Layered security defense for a workstation</title>
<desc id="desc">Five stacked security layers protect business data: people and identity with verification and MFA; endpoints with patching and antivirus; network with firewall and segmentation; data with encryption and least privilege; recovery with tested offline backups and an incident plan.</desc>
<rect width="1000" height="450" rx="24" fill="#f3f8fc"/>
<text x="500" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#132238">Defense in depth: several layers, not one magic control</text>
<g font-family="Arial,sans-serif">
<rect x="190" y="78" width="620" height="60" rx="14" fill="#dceeff" stroke="#285f92" stroke-width="3"/>
<text x="220" y="105" font-size="20" font-weight="700" fill="#132238">1 · People and identity</text><text x="500" y="128" font-size="16" fill="#243b53">verify requests · unique accounts · MFA · least privilege</text>
<rect x="190" y="150" width="620" height="60" rx="14" fill="#dff2e8" stroke="#075b35" stroke-width="3"/>
<text x="220" y="177" font-size="20" font-weight="700" fill="#132238">2 · Endpoint</text><text x="500" y="200" font-size="16" fill="#243b53">patching · endpoint protection · screen lock · device control</text>
<rect x="190" y="222" width="620" height="60" rx="14" fill="#fff0d6" stroke="#8c4a11" stroke-width="3"/>
<text x="220" y="249" font-size="20" font-weight="700" fill="#132238">3 · Network</text><text x="500" y="272" font-size="16" fill="#243b53">firewall rules · secure Wi-Fi · segmentation · monitoring</text>
<rect x="190" y="294" width="620" height="60" rx="14" fill="#eee4fa" stroke="#6941a5" stroke-width="3"/>
<text x="220" y="321" font-size="20" font-weight="700" fill="#132238">4 · Data</text><text x="500" y="344" font-size="16" fill="#243b53">encryption · access control · data minimization</text>
<rect x="190" y="366" width="620" height="60" rx="14" fill="#ffe3e3" stroke="#9c1c24" stroke-width="3"/>
<text x="220" y="393" font-size="20" font-weight="700" fill="#132238">5 · Recovery</text><text x="500" y="416" font-size="16" fill="#243b53">tested backups · incident response · restore practice</text>
</g>
</svg>
